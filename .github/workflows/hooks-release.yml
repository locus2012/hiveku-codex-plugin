name: Hook release integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hooks-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Refuse changed hook bundles without a new version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-hook-release.mjs "$BASE_SHA"
      - name: Test hooks, release guard and plugin contracts
        run: node --test test/*.test.mjs
